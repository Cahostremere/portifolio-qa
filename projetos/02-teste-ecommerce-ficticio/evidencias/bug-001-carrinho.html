<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Evidência BUG-001 - Carrinho</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#eef1f6; color:#1e293b; padding:1.5rem; }
  .frame { max-width:720px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.12); overflow:hidden; }
  .browser { background:#f1f5f9; padding:.6rem 1rem; display:flex; align-items:center; gap:.5rem; border-bottom:1px solid #e2e8f0; }
  .dot { width:11px; height:11px; border-radius:50%; }
  .r{background:#ef4444}.y{background:#f59e0b}.g{background:#22c55e}
  .url { margin-left:.6rem; background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:.25rem .7rem; font-size:.78rem; color:#64748b; }
  .content { padding:1.4rem; }
  h2 { font-size:1.05rem; margin-bottom:1rem; }
  .item { display:flex; justify-content:space-between; padding:.7rem 0; border-bottom:1px solid #f1f5f9; font-size:.92rem; }
  .item .name { color:#334155; }
  .item .price { font-weight:600; }
  .removed { text-decoration:line-through; color:#94a3b8; }
  .total { display:flex; justify-content:space-between; padding:1rem 0 .4rem; font-size:1.15rem; font-weight:700; }
  .expected { color:#16a34a; } .actual { color:#dc2626; }
  .note { background:#fef2f2; border-left:4px solid #dc2626; padding:.8rem 1rem; border-radius:6px; margin-top:1rem; font-size:.88rem; color:#7f1d1d; }
  .badge { display:inline-block; background:#dc2626; color:#fff; font-size:.72rem; font-weight:700; padding:.15rem .5rem; border-radius:4px; margin-bottom:.6rem; }
</style>
</head>
<body>
  <div class="frame">
    <div class="browser">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="url">https://loja-ficticia.exemplo.com/carrinho</span>
    </div>
    <div class="content">
      <span class="badge">BUG-001</span>
      <h2>Carrinho de compras</h2>
      <div class="item"><span class="name removed">Produto A</span><span class="price removed">R$ 100,00</span></div>
      <div class="item"><span class="name">Produto B</span><span class="price">R$ 50,00</span></div>
      <div class="total"><span>Total</span><span class="actual">R$ 150,00</span></div>
      <div class="note">
        <strong>Esperado:</strong> <span class="expected">R$ 50,00</span> (depois de remover o Produto A)<br>
        <strong>Obtido:</strong> <span class="actual">R$ 150,00</span>, o total não foi recalculado.<br>
        <strong>Passos:</strong> adicionar 2 produtos, remover 1 item e olhar o total.
      </div>
    </div>
  </div>
</body>
</html>
